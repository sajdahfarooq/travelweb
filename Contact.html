   <div class="contact-heading"> 
    <h1>Contact Us</h1> 
    <p>Have a destination in mind? Tell us about your travel plans and we'll help you plan your journey.</p> 
</div>
     
<form class="contact-form">
     <label>Client's Name:</label><input type="text"  placeholder="Enter Your Name" required>
     <label>Email Address:</label><input type="email" placeholder="Example@gmail.com" required><br><br>
     <label>Phone Number:</label><input type="tel" placeholder="Enter Your Phone Number" ><br><br>
     <label>Destination:</label><input type="text" placeholder="Enter Your Destination" required><br><br>
     <label>Travel Dates:</label><input type="date" required><br><br>
     <label>Number of Travelers:</label><input type="number" placeholder="Enter Number of Travelers" required><br><br>
     <label>Message:</label><textarea placeholder="Enter your message" ></textarea>  
    </div>
    <button type="submit">Send Inquiry</button>
</form>
